; PlatformIO project configuration for the Sentry Turret Arduino firmware.
;
; Conventional layout:
;   arduino/sentry_turret/
;   ├── platformio.ini    ← this file
;   ├── *.h / *.cpp       ← firmware source
;   ├── sentry_turret.ino ← Arduino sketch entry point
;   └── test/             ← Unity test suites (pio test)
;
; Environments:
;   [env:uno]    — build and upload to physical Arduino Uno R3
;   [env:native] — compile and run unit tests on the host machine (no hardware)

[platformio]
default_envs = native

; ──────────────────────────────────────────────────────────────────────────────
; Upload target: Arduino Uno R3 (ATmega328P)
; ──────────────────────────────────────────────────────────────────────────────
[env:uno]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200

; ──────────────────────────────────────────────────────────────────────────────
; Native host test runner (GCC on Linux/macOS/Windows)
; Arduino-specific headers are excluded via NATIVE_ENV guards in each module.
; ──────────────────────────────────────────────────────────────────────────────
[env:native]
platform  = native
build_flags =
    -std=c++17
    -DNATIVE_ENV
    -Wall
    -Wextra
    -I.
test_framework = unity
