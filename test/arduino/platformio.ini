; PlatformIO configuration for Sentry Turret Arduino firmware.
; Two environments:
;   [env:uno]    — upload to physical Arduino Uno R3
;   [env:native] — compile and run pure-logic unit tests on the host machine
;
; Both environments set build_src_dir to the firmware source so PlatformIO
; can locate all modules from this test/ working directory.

[platformio]
default_envs = native

; ──────────────────────────────────────────────────────────────────────────────
; Upload target: Arduino Uno R3 (ATmega328P, avr-gcc)
; ──────────────────────────────────────────────────────────────────────────────
[env:uno]
platform  = atmelavr
board     = uno
framework = arduino
build_src_dir = ../../arduino/sentry_turret

; ──────────────────────────────────────────────────────────────────────────────
; Native host test runner (GCC on Linux/macOS/Windows)
; Arduino-specific headers (Arduino.h, SoftwareSerial.h) are excluded via
; the NATIVE_ENV guard used in each module.
; ──────────────────────────────────────────────────────────────────────────────
[env:native]
platform  = native
build_src_dir = ../../arduino/sentry_turret
build_flags =
    -std=c++17
    -DNATIVE_ENV
    -Wall
    -Wextra
    -I../../arduino/sentry_turret
test_framework = unity
