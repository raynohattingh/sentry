# Sentry Jetson Core — Configuration Reference
# Every parameter in config.py is documented here with its unit, valid range,
# and default value. Operators should edit config.py (or env vars) to tune the
# system; this file is reference documentation only.

# ---------------------------------------------------------------------------
# Hardware — Serial
# ---------------------------------------------------------------------------
SERIAL_PORT:
  type: str
  default: /dev/ttyUSB0
  description: Arduino serial port path
  valid_range: Valid device path

BAUD_RATE:
  type: int
  default: 115200
  unit: baud
  description: Serial baud rate (fixed — must match Arduino firmware)

SERIAL_RETRY_INTERVAL_S:
  type: float
  default: 3.0
  unit: seconds
  valid_range: 0.5 – 30
  description: Delay between serial reconnect attempts

SERIAL_HEARTBEAT_TIMEOUT_S:
  type: float
  default: 2.0
  unit: seconds
  valid_range: 0.5 – 10
  description: Maximum silence from Arduino before reconnect is triggered

LRF_ENABLED:
  type: bool
  default: true
  description: Enable laser rangefinder; when false all GPS fields are null

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------
CAMERA_INDEX:
  type: int
  default: 0
  valid_range: 0 – 9
  description: V4L2 device index

CAMERA_WIDTH:
  type: int
  default: 480
  unit: pixels
  valid_range: 320 – 1920
  description: Capture frame width

CAMERA_HEIGHT:
  type: int
  default: 320
  unit: pixels
  valid_range: 240 – 1080
  description: Capture frame height

USE_GSTREAMER:
  type: bool
  default: true
  description: Attempt GStreamer pipeline before falling back to V4L2

GST_PIPELINE:
  type: str
  default: "v4l2src device=/dev/video0 ! video/x-raw,format=YUY2,width=480,height=320,framerate=25/1 ! videoconvert ! video/x-raw,format=BGR ! appsink drop=1"
  description: Full GStreamer pipeline string

CAMERA_FAULT_THRESHOLD:
  type: int
  default: 5
  unit: frames
  valid_range: 1 – 50
  description: Consecutive failed cap.read() calls before camera fault is declared

CAMERA_FPS:
  type: int
  default: 25
  unit: frames/second
  valid_range: 1 – 120
  description: Camera capture frame rate; used for pixel-to-m/s velocity conversion

CAMERA_HFOV_DEG:
  type: float
  default: 120.0
  unit: degrees
  valid_range: 10 – 180
  description: Horizontal field-of-view of the camera lens; calibrate per physical lens

# ---------------------------------------------------------------------------
# AI / Inference
# ---------------------------------------------------------------------------
MODEL_PATH:
  type: str
  default: yolov8n.engine
  description: Path to YOLOv8 model (.pt for dev, .engine for TRT production)

CONF_THRESHOLD:
  type: float
  default: 0.5
  valid_range: 0.1 – 0.95
  description: Minimum YOLO confidence to emit a Detection

TARGET_CLASS_ID:
  type: int
  default: 0
  valid_range: 0 – 79
  description: COCO class ID to track (0 = person)

# ---------------------------------------------------------------------------
# Tracking
# ---------------------------------------------------------------------------
MAX_DISAPPEARED:
  type: int
  default: 30
  unit: frames
  valid_range: 5 – 200
  description: Frames without a detection before target is deregistered

MAX_CENTROID_DISTANCE:
  type: int
  default: 300
  unit: pixels
  valid_range: 50 – 500
  description: Maximum centroid displacement allowed for same-ID matching

# ---------------------------------------------------------------------------
# Threat Scoring
# ---------------------------------------------------------------------------
HIGH_THREAT_THRESHOLD:
  type: float
  default: 80.0
  unit: score
  valid_range: 50 – 100
  description: Score >= this triggers ACQUIRE state and continuous LRF

MED_THREAT_THRESHOLD:
  type: float
  default: 40.0
  unit: score
  valid_range: 10 – 80
  description: Score >= this triggers TRACK state and sampled LRF

W_DISTANCE:
  type: float
  default: 0.4
  valid_range: 0.0 – 1.0
  description: Weight for bounding-box-area distance component

W_MOTION:
  type: float
  default: 0.3
  valid_range: 0.0 – 1.0
  description: Weight for velocity magnitude component

W_GROUPING:
  type: float
  default: 0.2
  valid_range: 0.0 – 1.0
  description: Weight for multi-target grouping component

W_TIME_OF_DAY:
  type: float
  default: 0.1
  valid_range: 0.0 – 1.0
  description: Weight for night-hours multiplier

GROUP_RADIUS_PX:
  type: int
  default: 80
  unit: pixels
  valid_range: 10 – 500
  description: Centroid distance threshold for grouping two targets

GROUP_MAX_COUNT:
  type: int
  default: 3
  unit: count
  valid_range: 1 – 20
  description: Target count at which grouping component saturates to 1.0

LRF_SAMPLE_INTERVAL_MS:
  type: int
  default: 500
  unit: ms
  valid_range: 100 – 5000
  description: Interval between LRF firings in MED-threat sampled-track mode

LRF_SWEEP_ARC_DEG:
  type: float
  default: 5.0
  unit: degrees
  valid_range: 1.0 – 30.0
  description: Pan offset between first and second LRF firing in sampled mode

NIGHT_START_HOUR:
  type: int
  default: 20
  unit: hour (0-23)
  valid_range: 0 – 23
  description: UTC hour at which the night multiplier activates

NIGHT_END_HOUR:
  type: int
  default: 6
  unit: hour (0-23)
  valid_range: 0 – 23
  description: UTC hour at which the night multiplier deactivates

# ---------------------------------------------------------------------------
# Motion Control (PID)
# ---------------------------------------------------------------------------
PAN_KP:
  type: float
  default: 3.0
  valid_range: 0.1 – 20
  description: Pan axis proportional gain

PAN_KI:
  type: float
  default: 0.0
  valid_range: 0.0 – 5
  description: Pan axis integral gain

PAN_KD:
  type: float
  default: 0.1
  valid_range: 0.0 – 2
  description: Pan axis derivative gain

PAN_MAX:
  type: float
  default: 1500.0
  unit: steps/sec
  valid_range: 100 – 3000
  description: Pan axis maximum output velocity

TILT_KP:
  type: float
  default: 3.0
  valid_range: 0.1 – 20
  description: Tilt axis proportional gain

TILT_KI:
  type: float
  default: 0.0
  valid_range: 0.0 – 5
  description: Tilt axis integral gain

TILT_KD:
  type: float
  default: 0.1
  valid_range: 0.0 – 2
  description: Tilt axis derivative gain

TILT_MAX:
  type: float
  default: 1500.0
  unit: steps/sec
  valid_range: 100 – 3000
  description: Tilt axis maximum output velocity

DEAD_ZONE:
  type: int
  default: 20
  unit: pixels
  valid_range: 5 – 100
  description: Target-to-centre pixel radius within which velocity is zeroed

CENTER_X:
  type: int
  default: 240
  unit: pixels
  description: Frame centre X (CAMERA_WIDTH / 2); auto-derived

CENTER_Y:
  type: int
  default: 160
  unit: pixels
  description: Frame centre Y (CAMERA_HEIGHT / 2); auto-derived

IDLE_TIMEOUT_S:
  type: float
  default: 5.0
  unit: seconds
  valid_range: 1.0 – 60
  description: No-target timeout before FSM transitions to SCAN

PID_MAX_INTEGRAL:
  type: float
  default: 500.0
  unit: steps/sec
  description: Anti-windup integral clamp for both PID axes

# ---------------------------------------------------------------------------
# Turret Limits
# ---------------------------------------------------------------------------
HOUSING_PROFILE:
  type: str
  default: MVP
  valid_range: TEST_BENCH | MVP
  description: Per-unit housing profile persisted on the Jetson runtime; TEST_BENCH enables software-bound bypass and MVP requires physical limit-switch validation

TEST_BENCH_PAN_MIN_STEPS:
  type: int
  default: null
  unit: steps
  valid_range: Any integer lower than TEST_BENCH_PAN_MAX_STEPS
  description: Inclusive left pan bound used only when HOUSING_PROFILE=TEST_BENCH

TEST_BENCH_PAN_MAX_STEPS:
  type: int
  default: null
  unit: steps
  valid_range: Any integer greater than TEST_BENCH_PAN_MIN_STEPS
  description: Inclusive right pan bound used only when HOUSING_PROFILE=TEST_BENCH

TEST_BENCH_TILT_MIN_STEPS:
  type: int
  default: null
  unit: steps
  valid_range: Any integer lower than TEST_BENCH_TILT_MAX_STEPS
  description: Inclusive lower tilt bound used only when HOUSING_PROFILE=TEST_BENCH

TEST_BENCH_TILT_MAX_STEPS:
  type: int
  default: null
  unit: steps
  valid_range: Any integer greater than TEST_BENCH_TILT_MIN_STEPS
  description: Inclusive upper tilt bound used only when HOUSING_PROFILE=TEST_BENCH

PAN_LIMIT_WARN_STEPS:
  type: int
  default: 4500
  unit: steps
  valid_range: 100 – 50000
  description: Pan position (absolute) where velocity tapering begins

PAN_LIMIT_HARD_STEPS:
  type: int
  default: 5000
  unit: steps
  valid_range: 100 – 50000
  description: Pan hard stop (absolute); velocity tapers to 0 at this value

TILT_LIMIT_WARN_STEPS:
  type: int
  default: 900
  unit: steps
  valid_range: 100 – 10000
  description: Tilt position (absolute) where velocity tapering begins

TILT_LIMIT_HARD_STEPS:
  type: int
  default: 1000
  unit: steps
  valid_range: 100 – 10000
  description: Tilt hard stop (absolute); velocity tapers to 0 at this value

STEPS_PER_DEGREE:
  type: float
  default: 10.0
  unit: steps/degree
  valid_range: 1 – 100
  description: Mechanical conversion factor for pan/tilt axes

# ---------------------------------------------------------------------------
# FSM Dwell Timers
# ---------------------------------------------------------------------------
MIN_DWELL_MS_SCAN:
  type: int
  default: 500
  unit: ms
  valid_range: 0 – 5000
  description: Minimum time in SCAN before a downward transition is allowed

MIN_DWELL_MS_TRACK:
  type: int
  default: 300
  unit: ms
  valid_range: 0 – 5000
  description: Minimum time in TRACK before a downward transition is allowed

MIN_DWELL_MS_ACQUIRE:
  type: int
  default: 500
  unit: ms
  valid_range: 0 – 5000
  description: Minimum time in ACQUIRE before a downward transition is allowed

MIN_DWELL_MS_SEARCH:
  type: int
  default: 200
  unit: ms
  valid_range: 0 – 5000
  description: Minimum time in SEARCH before a downward transition is allowed

# ---------------------------------------------------------------------------
# Scan Sweep
# ---------------------------------------------------------------------------
SCAN_PAN_MIN:
  type: int
  default: -4000
  unit: steps
  valid_range: -50000 – 0
  description: Left boundary of oscillating SCAN sweep

SCAN_PAN_MAX:
  type: int
  default: 4000
  unit: steps
  valid_range: 0 – 50000
  description: Right boundary of oscillating SCAN sweep

SCAN_VELOCITY:
  type: float
  default: 200.0
  unit: steps/sec
  valid_range: 10 – 1500
  description: Turret speed during SCAN and SEARCH sweeps

SCAN_TILT_HOME:
  type: int
  default: 0
  unit: steps
  valid_range: -1000 – 1000
  description: Tilt step position during SCAN state

# ---------------------------------------------------------------------------
# Search Arc
# ---------------------------------------------------------------------------
SEARCH_ARC_DEG:
  type: float
  default: 45.0
  unit: degrees
  valid_range: 10 – 180
  description: Half-arc width for the SEARCH state pan sweep

SEARCH_TIMEOUT_S:
  type: float
  default: 10.0
  unit: seconds
  valid_range: 2 – 60
  description: SEARCH transitions to SCAN if no target re-acquired within this time

# ---------------------------------------------------------------------------
# GPS / Geo
# ---------------------------------------------------------------------------
SENTRY_LAT:
  type: float
  default: 0.0
  unit: decimal degrees
  valid_range: -90 – 90
  description: Sentry installation GPS latitude (WGS-84)

SENTRY_LON:
  type: float
  default: 0.0
  unit: decimal degrees
  valid_range: -180 – 180
  description: Sentry installation GPS longitude (WGS-84)

SENTRY_HEADING_DEG:
  type: float
  default: 0.0
  unit: degrees (true north)
  valid_range: 0 – 360
  description: True-north bearing when turret pan is at zero steps

# ---------------------------------------------------------------------------
# Telemetry
# ---------------------------------------------------------------------------
TELEMETRY_LOG_PATH:
  type: str
  default: /app/logs/telemetry.jsonl
  description: Absolute path for the rotating JSON-lines telemetry log

TELEMETRY_MAX_BYTES:
  type: int
  default: 10485760
  unit: bytes
  valid_range: 1048576 – 1073741824
  description: Maximum log file size before rotation (default 10 MB)

TELEMETRY_BACKUP_COUNT:
  type: int
  default: 5
  valid_range: 1 – 50
  description: Number of rotated telemetry log files to retain

# ---------------------------------------------------------------------------
# MQTT
# ---------------------------------------------------------------------------
MQTT_BROKER:
  type: str
  default: localhost
  description: MQTT broker hostname or IP address

MQTT_PORT:
  type: int
  default: 8883
  valid_range: 1 – 65535
  description: MQTT broker TCP port (8883 = TLS; 1883 = plain TCP for testing)

MQTT_TOPIC:
  type: str
  default: sentry/telemetry
  description: MQTT topic for telemetry record publication

MQTT_STATUS_TOPIC:
  type: str
  default: sentry/status
  description: MQTT topic for authoritative runtime safety-status publication

MQTT_COMMAND_TOPIC:
  type: str
  default: sentry/command
  description: MQTT topic for inbound manual-override commands (joystick → CommandSubscriber)

MQTT_USERNAME:
  type: str
  default: ""
  description: MQTT broker username; leave empty to disable authentication

MQTT_PASSWORD:
  type: str
  default: ""
  description: MQTT broker password; leave empty to disable authentication

SENTRY_ID:
  type: str
  default: (required — no default)
  description: Unique sentry identifier; must be set via env var before launch

COMMAND_SAFETY_TIMEOUT_S:
  type: float
  default: 3.0
  unit: seconds
  valid_range: 0.5 – 30
  description: Idle timeout for manual-override mode; turret stops if no command received within this window

COMMAND_RATE_LIMIT_HZ:
  type: int
  default: 20
  unit: Hz
  valid_range: 1 – 100
  description: Maximum rate at which inbound joystick commands are forwarded to TurretManager

# ---------------------------------------------------------------------------
# Web HUD
# ---------------------------------------------------------------------------
HUD_USERNAME:
  type: str
  default: sentry
  description: HTTP Basic Auth username for the web HUD

HUD_PASSWORD:
  type: str
  default: changeme
  description: HTTP Basic Auth password — change before field deployment

# ---------------------------------------------------------------------------
# Resilience / Boot Counter
# ---------------------------------------------------------------------------
MAX_BOOT_FAILURES:
  type: int
  default: 3
  valid_range: 1 – 10
  description: Consecutive GPU init failures before Jetson OS reboot is triggered

BOOT_STATE_PATH:
  type: str
  default: /app/state/boot_state.json
  description: Path to the persistent JSON file tracking consecutive boot failures
