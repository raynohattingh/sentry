services:
  sentry-brain:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentry_brain
    
    # CRITICAL: Enables GPU Access
    runtime: nvidia
    
    # Restart Policy: If it crashes, bring it back up
    restart: unless-stopped
    
    # Network: Expose the Flask stream
    ports:
      - "5000:5000"
    
    # Hardware Access
    # We use 'privileged' for development to access all USBs easily.
    privileged: true
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      
    # Map code directory for development
    volumes:
      - ../src:/app/src
      - sentry_state:/app/state
      - sentry_logs:/app/logs

    # Environment Config
    environment:
      - SERIAL_PORT=/dev/ttyUSB0
      - FLASK_ENV=development
      - MQTT_BROKER=localhost
      - MQTT_PORT=1883
      - MQTT_TOPIC=sentry/telemetry
      - HUD_USERNAME=sentry
      - HUD_PASSWORD=changeme

volumes:
  sentry_state:
  sentry_logs:
